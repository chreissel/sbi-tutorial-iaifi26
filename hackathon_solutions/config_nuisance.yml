# Nuisance-marginalisation solution: infer (age, logmsat) while marginalising
# over the 8 uncertain tidal-stripping micro-parameters. The nuisance node
# `z_nuis` gets a prior but NO `evidence:`, so falcon samples it and integrates
# it out automatically — exactly notebook 2's nuisance pattern, applied to the
# stripping physics we do not want to commit to.
#
#   falcon launch -c hackathon_solutions/config_nuisance.yml -o hackathon_solutions/output/nuisance --no-interactive

logging:
  wandb: {enabled: false}
  local: {enabled: true}

paths:
  imports: ["."]

buffer:
  min_samples: 384
  max_samples: 768
  validation_samples: 128
  simulate_count: 256
  simulate_when_full: false

graph:
  z:                                   # inferred parameters
    evidence: [x]
    simulator:
      _target_: falcon.priors.Product
      priors:
        - ['uniform', 500.0, 5000.0]   # age
        - ['uniform', 3.0, 4.5]        # logmsat
    estimator:
      _target_: falcon.estimators.Flow
      max_epochs: 50
      net_type: nsf
      lr: 0.003
      gamma: 0.5
      embedding:
        _target_: streams_model.StreamCNN
        out_features: 16
        _input_: [x]
      batch_size: 64
      early_stop_patience: 20
      theta_norm: true
      use_best_models: true
    ray:
      num_gpus: 0

  z_nuis:                              # nuisance — prior, NO evidence => marginalised
    simulator:
      _target_: falcon.priors.Product
      priors:
        - ['uniform', 0.0001, 0.01]    # xi0
        - ['uniform', 10.0, 30.0]      # alpha
        - ['uniform', 0.0001, 0.01]    # rh
        - ['uniform', 1.0, 20.0]       # mbar
        - ['uniform', 0.1, 5.0]        # sigv
        - ['uniform', 0.1, 2.0]        # lrelease
        - ['uniform', 0.1, 2.0]        # lmatch
        - ['uniform', 0.0, 1.0]        # stripnear

  x:
    parents: [z, z_nuis]               # data depends on both blocks
    simulator:
      _target_: streams_model.StreamImage
      infer_params: [age, logmsat]
      nuisance_params: [xi0, alpha, rh, mbar, sigv, lrelease, lmatch, stripnear]
    observed: "./hackathon_solutions/obs_stream.npy"

sample:
  posterior:
    n: 800
